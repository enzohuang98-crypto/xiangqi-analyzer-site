name: Sync installer release info

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-release
  cancel-in-progress: false

jobs:
  sync:
    name: Sync version/hash badge from Reckoning releases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch latest Reckoning release and update pages
        run: node scripts/sync-release.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run site checks
        run: node scripts/check-site.mjs

      - name: Verify the rewritten badge matches data/release.json
        run: node scripts/verify-release-markers.mjs

      - name: Commit and push if release info changed
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No release changes to sync."
            exit 0
          fi
          version="$(node -p "require('./data/release.json').version")"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html guide.html data/release.json
          git commit -m "chore: sync installer release info to v${version}"
          git push
